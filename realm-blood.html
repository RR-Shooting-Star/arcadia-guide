<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나락의 층계 — 피의 신</title>
<style>
@keyframes heartbeat{ 0%,100%{ opacity:.55; transform:scale(1);} 8%{opacity:1; transform:scale(1.04);} 16%{opacity:.6; transform:scale(1);} 24%{opacity:.9; transform:scale(1.02);} 32%{opacity:.55; transform:scale(1);} }
@keyframes dripfall{ 0%{transform:translateY(0); opacity:0;} 10%{opacity:1;} 85%{opacity:1;} 100%{transform:translateY(90px); opacity:0;} }
@keyframes mistdrift{ 0%{transform:translateX(-30px);} 100%{transform:translateX(30px);} }
@keyframes fadeUp{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
@keyframes descend{ from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);} }

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; min-height:100vh; position:relative; overflow-x:hidden;
  background:radial-gradient(ellipse 900px 500px at 50% 0%, rgba(143,58,58,.4), transparent 60%),
    linear-gradient(180deg, #0d0506 0%, #2a0a0d 50%, #0d0506 100%);
  color:#e8c9c9; font-family:"Nanum Myeongjo","Noto Serif KR",Georgia,serif;
}

.pulse-glow{position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(ellipse 700px 400px at 50% 30%, rgba(201,79,79,.25), transparent 65%);
  animation:heartbeat 4s ease-in-out infinite;}

.back-link{position:fixed; top:20px; left:20px; z-index:20; font-family:"Malgun Gothic",sans-serif;
  font-size:.78rem; color:#e0a3a3; text-decoration:none; letter-spacing:.05em; border:1px solid rgba(201,79,79,.35);
  padding:7px 14px; border-radius:20px; background:rgba(13,5,6,.4); backdrop-filter:blur(4px);}
.back-link:hover{color:#f0d58a; border-color:#f0d58a;}

.mist{position:fixed; bottom:0; left:0; width:140%; height:180px; z-index:1; pointer-events:none;
  background:linear-gradient(180deg, transparent, rgba(92,28,34,.5));
  animation:mistdrift 10s ease-in-out infinite alternate; filter:blur(8px);}

.drips{position:fixed; top:0; left:0; width:100%; height:120px; z-index:2; pointer-events:none; overflow:visible;}
.drip{position:absolute; top:0; width:3px; height:22px; border-radius:0 0 3px 3px; background:#8f3a3a; animation:dripfall linear infinite;}

main{position:relative; z-index:5; max-width:800px; margin:0 auto; padding:130px 24px 120px;}

.eyebrow{text-align:center; font-size:.7rem; letter-spacing:.45em; color:#b56464; text-transform:uppercase; margin-bottom:22px; animation:fadeUp 1s ease both;}
h1{text-align:center; font-size:clamp(2.6rem,7vw,4.2rem); margin:0 0 .2em; color:#e8b3b3;
  text-shadow:0 0 34px rgba(143,58,58,.6); letter-spacing:.08em; animation:fadeUp 1s ease .1s both;}
.subtitle{text-align:center; font-style:italic; color:#c98a8a; font-size:1.05rem; margin-bottom:50px; animation:fadeUp 1s ease .2s both;}

.stairs{max-width:280px; margin:0 auto 60px; animation:fadeUp 1s ease .3s both;}
.stair{height:20px; background:linear-gradient(90deg, #6b1f24, #8f3a3a); margin:0 auto; border-radius:2px;
  box-shadow:0 6px 14px rgba(0,0,0,.4); animation:descend .5s ease both;}

.desc{font-size:1.08rem; line-height:2.1; color:#e0c2c2; text-align:center; max-width:640px; margin:0 auto 60px;
  animation:fadeUp 1s ease .4s both;}

.relics-row{display:flex; justify-content:center; gap:26px; margin:0 auto 70px; flex-wrap:wrap; animation:fadeUp 1s ease .5s both; opacity:.8;}
.relic{width:60px; height:99px;}

.gallery-title{text-align:center; font-size:.72rem; letter-spacing:.3em; color:#b56464; text-transform:uppercase; margin-bottom:22px;}
.gallery-slot{max-width:640px; margin:0 auto 70px; aspect-ratio:16/9; border:1px dashed rgba(201,79,79,.4); border-radius:12px;
  display:flex; align-items:center; justify-content:center; color:#b56464; font-family:"Malgun Gothic",sans-serif; font-size:.85rem;
  background:rgba(143,58,58,.08); position:relative; overflow:hidden;}
.gallery-slot img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none;}

.footer-mark{text-align:center; font-size:.72rem; color:#7a4444; letter-spacing:.15em; padding-top:30px; border-top:1px solid rgba(201,79,79,.2);}
</style>
</head>
<body>

<a class="back-link" href="realms.html">◀ 신계로</a>
<div class="pulse-glow"></div>
<div class="mist"></div>
<div class="drips" id="dripField"></div>

<main>
  <div class="eyebrow">The Realm of Blood</div>
  <h1>나락의 층계</h1>
  <div class="subtitle">피의 신이 머무는 곳</div>

  <div class="stairs" id="stairsWrap"></div>

  <p class="desc">
    끝없이 이어지는 붉은 계단이 아래로, 또 아래로 뻗어 있다. 짙은 피안개가 계단 사이로 낮게 깔려 있고,
    곳곳에 오래된 무기와 갑옷이 말없이 놓여 있다. 심장 박동처럼 낮게 울리는 진동이 계단 전체를 타고 흐르며,
    엄숙하고 비장한 공기가 감돈다.
  </p>

  <div class="relics-row">
    <svg class="relic" viewBox="0 0 46 76" xmlns="http://www.w3.org/2000/svg">
      <rect x="19" y="4" width="8" height="66" rx="2" fill="#8f3a3a"/>
      <rect x="19" y="4" width="3" height="66" rx="1.5" fill="#c94f4f" opacity="0.55"/>
      <rect x="6" y="18" width="34" height="8" rx="2" fill="#8f3a3a"/>
      <rect x="6" y="18" width="34" height="3" rx="1.5" fill="#c94f4f" opacity="0.5"/>
      <circle cx="23" cy="22" r="3.5" fill="#3d0f14"/>
    </svg>
    <svg class="relic" viewBox="0 0 46 76" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="23" cy="38" rx="17" ry="26" fill="#3d0f14" stroke="#c94f4f" stroke-width="2"/>
    </svg>
    <svg class="relic" viewBox="0 0 46 76" xmlns="http://www.w3.org/2000/svg">
      <rect x="19" y="6" width="8" height="66" rx="2" fill="#8f3a3a"/>
      <rect x="19" y="6" width="3" height="66" rx="1.5" fill="#c94f4f" opacity="0.55"/>
      <rect x="6" y="50" width="34" height="8" rx="2" fill="#8f3a3a"/>
      <rect x="6" y="50" width="34" height="3" rx="1.5" fill="#c94f4f" opacity="0.5"/>
      <circle cx="23" cy="54" r="3.5" fill="#3d0f14"/>
    </svg>
  </div>

  <div class="gallery-title">Gallery</div>
  <div class="gallery-slot">
    <span class="gallery-slot-text">[나락의 층계 이미지 삽입 위치]</span>
    <img src="images/realms/나락의층계.png" alt="나락의 층계" onload="this.previousElementSibling.style.display='none'; this.style.display='block';" onerror="this.style.display='none'">
  </div>

  <div class="footer-mark">Chronicles of Arcadia · 신계</div>
</main>

<script>
const stairsWrap = document.getElementById('stairsWrap');
const steps = 8;
for(let i=0;i<steps;i++){
  const s = document.createElement('div');
  s.className = 'stair';
  const w = 100 - i*8;
  s.style.width = w+'%';
  s.style.animationDelay = (i*0.08)+'s';
  stairsWrap.appendChild(s);
}

const dripField = document.getElementById('dripField');
for(let i=0;i<18;i++){
  const d = document.createElement('div');
  d.className = 'drip';
  d.style.left = (Math.random()*100)+'vw';
  d.style.animationDuration = (2.5 + Math.random()*2.5)+'s';
  d.style.animationDelay = '-'+(Math.random()*4)+'s';
  dripField.appendChild(d);
}
</script>
</body>
</html>
