<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>규율의 틈새 — 혼돈과 질서의 신</title>
<style>
@keyframes floaty{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-18px) rotate(8deg);} }
@keyframes glitch{ 0%,94%,100%{ transform:translate(0,0); opacity:1;} 95%{ transform:translate(-2px,1px); opacity:.8;} 96%{ transform:translate(2px,-1px); opacity:1;} 97%{ transform:translate(-1px,0); opacity:.7;} }
@keyframes fadeUp{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
@keyframes runeglow{ 0%,100%{ opacity:.3;} 50%{ opacity:.9;} }

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; min-height:100vh; position:relative; overflow-x:hidden;
  background:linear-gradient(90deg, #050505 0%, #050505 49.5%, #f0f0f2 50.5%, #f0f0f2 100%);
  font-family:"Nanum Myeongjo","Noto Serif KR",Georgia,serif;
}

.back-link{position:fixed; top:20px; left:20px; z-index:20; font-family:"Malgun Gothic",sans-serif;
  font-size:.78rem; color:#8a8a92; text-decoration:none; letter-spacing:.05em; border:1px solid rgba(138,106,47,.4);
  padding:7px 14px; border-radius:20px; background:rgba(120,120,120,.15); backdrop-filter:blur(4px);}
.back-link:hover{color:#8a6a2f; border-color:#8a6a2f;}

.chaos-lines{position:fixed; top:0; left:0; width:50%; height:100%; z-index:1; pointer-events:none; opacity:.4;}
.order-grid{position:fixed; top:0; right:0; width:50%; height:100%; z-index:1; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(5,5,5,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(5,5,5,.5) 1px, transparent 1px);
  background-size:44px 44px;}

.shape{position:absolute; animation:floaty ease-in-out infinite;}

main{position:relative; z-index:5; max-width:800px; margin:0 auto; padding:130px 24px 120px; animation:glitch 9s linear infinite;}

.eyebrow{text-align:center; font-size:.7rem; letter-spacing:.45em; text-transform:uppercase; margin-bottom:22px; animation:fadeUp 1s ease both;
  background:linear-gradient(90deg,#f0f0f2,#f0f0f2 49%,#050505 51%,#050505); -webkit-background-clip:text; background-clip:text; color:transparent;}
h1{text-align:center; font-size:clamp(2.6rem,7vw,4.2rem); margin:0 0 .2em; letter-spacing:.1em; animation:fadeUp 1s ease .1s both;
  background:linear-gradient(90deg,#f0f0f2,#f0f0f2 49%,#050505 51%,#050505); -webkit-background-clip:text; background-clip:text; color:transparent;}
.subtitle{text-align:center; font-style:italic; font-size:1.05rem; margin-bottom:50px; animation:fadeUp 1s ease .2s both;
  background:linear-gradient(90deg,#c9c9cf,#c9c9cf 49%,#3a3a3a 51%,#3a3a3a); -webkit-background-clip:text; background-clip:text; color:transparent;}

.symbol-wrap{display:flex; justify-content:center; margin:40px 0 60px; animation:fadeUp 1s ease .3s both;}
.symbol{width:150px; height:150px;}

.desc-wrap{display:flex; max-width:640px; margin:0 auto 60px; animation:fadeUp 1s ease .4s both; border-radius:8px; overflow:hidden;
  border:1px solid rgba(138,106,47,.4);}
.desc-half{flex:1; padding:22px 20px; font-size:.98rem; line-height:1.9;}
.desc-half.dark{background:rgba(5,5,5,.85); color:#e4e4e8;}
.desc-half.light{background:rgba(240,240,242,.9); color:#1a1a1a;}

.rune-row{display:flex; justify-content:center; gap:22px; margin:0 auto 70px; animation:fadeUp 1s ease .5s both;}
.rune{width:32px; height:32px; border:1px solid #8a6a2f; transform:rotate(45deg); animation:runeglow 2.6s ease-in-out infinite;}
.rune:nth-child(2){border-radius:50%; transform:none;}
.rune:nth-child(4){border-radius:50%; transform:none;}

.gallery-title{text-align:center; font-size:.72rem; letter-spacing:.3em; text-transform:uppercase; margin-bottom:22px; color:#8a6a2f;}
.gallery-slot{max-width:640px; margin:0 auto 70px; aspect-ratio:16/9; border:1px dashed #8a6a2f; border-radius:12px;
  display:flex; align-items:center; justify-content:center; font-family:"Malgun Gothic",sans-serif; font-size:.85rem; color:#8a6a2f;
  background:linear-gradient(90deg, rgba(5,5,5,.5), rgba(5,5,5,.5) 49%, rgba(240,240,242,.6) 51%, rgba(240,240,242,.6));
  position:relative; overflow:hidden;}
.gallery-slot img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none;}

.footer-mark{text-align:center; font-size:.72rem; letter-spacing:.15em; padding-top:30px; border-top:1px solid rgba(138,106,47,.3);
  background:linear-gradient(90deg,#8a8a92,#8a8a92 49%,#4a4a4a 51%,#4a4a4a); -webkit-background-clip:text; background-clip:text; color:transparent;}
</style>
</head>
<body>

<a class="back-link" href="realms.html">◀ 신계로</a>

<svg class="chaos-lines" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <g stroke="#f0f0f2" stroke-width="1" fill="none">
    <path d="M20,100 L90,40 M40,180 L130,80 M10,260 L70,210 M60,340 L150,260 M20,420 L100,360 M50,500 L140,430 M10,580 L80,520 M40,660 L120,600 M20,740 L90,690"/>
  </g>
</svg>
<div class="order-grid"></div>

<main>
  <div class="eyebrow">The Realm of Chaos and Order</div>
  <h1>규율의 틈새</h1>
  <div class="subtitle">혼돈과 질서의 신이 머무는 곳</div>

  <div class="symbol-wrap">
    <svg class="symbol" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
      <circle cx="75" cy="75" r="60" fill="none" stroke="#8a6a2f" stroke-width="1.5"/>
      <path d="M75,15 A30,30 0 0,1 75,75 A30,30 0 0,0 75,135 A60,60 0 0,0 75,15 Z" fill="#050505"/>
      <path d="M75,15 A60,60 0 0,1 75,135 A30,30 0 0,1 75,75 A30,30 0 0,0 75,15 Z" fill="#f0f0f2"/>
      <circle cx="75" cy="45" r="8" fill="#f0f0f2"/>
      <circle cx="75" cy="105" r="8" fill="#050505"/>
    </svg>
  </div>

  <div class="desc-wrap">
    <div class="desc-half dark">새하얀 대리석으로 지어진 신전, 그 안으로 무한히 이어지는 복도.</div>
    <div class="desc-half light">공중에는 기하학적인 구조물들이 떠 있고, 빛으로 이루어진 문자와 계율이 벽과 허공에 새겨져 있다.</div>
  </div>
  <p style="text-align:center; max-width:640px; margin:-40px auto 60px; font-size:.98rem; line-height:1.9; color:#8a8a92;">
    차갑고 고요하지만, 어딘가 현실감이 흐려지는 듯한 공간이다.
  </p>

  <div class="rune-row">
    <div class="rune"></div><div class="rune"></div><div class="rune"></div><div class="rune"></div><div class="rune"></div>
  </div>

  <div class="gallery-title">Gallery</div>
  <div class="gallery-slot">
    <span class="gallery-slot-text">[규율의 틈새 이미지 삽입 위치]</span>
    <img src="images/realms/규율의틈새.png" alt="규율의 틈새" onload="this.previousElementSibling.style.display='none'; this.style.display='block';" onerror="this.style.display='none'">
  </div>

  <div class="footer-mark">Chronicles of Arcadia · 신계</div>
</main>

<script>
const shapes = [
  {x:'8%', y:'20%', size:34, type:'square'},
  {x:'85%', y:'15%', size:28, type:'circle'},
  {x:'12%', y:'55%', size:22, type:'circle'},
  {x:'88%', y:'50%', size:36, type:'square'},
  {x:'6%', y:'80%', size:26, type:'square'},
  {x:'90%', y:'78%', size:24, type:'circle'}
];
const body = document.body;
shapes.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className = 'shape';
  el.style.left = s.x;
  el.style.top = s.y;
  el.style.width = s.size+'px';
  el.style.height = s.size+'px';
  el.style.border = '1px solid #8a6a2f';
  el.style.borderRadius = s.type==='circle' ? '50%' : '2px';
  el.style.animationDuration = (5+i)+'s';
  el.style.animationDelay = (i*0.4)+'s';
  el.style.zIndex = '2';
  el.style.pointerEvents = 'none';
  body.appendChild(el);
});
</script>
</body>
</html>
