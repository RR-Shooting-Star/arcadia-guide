<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국가 — 아르카디아 가이드</title>
<style>
:root{
  --bg:#f2f1ec; --bg2:#eae8df; --card:#fbfaf6; --card-light:#f4f2ea; --line:#ddd7c6;
  --ink:#201d18; --ink2:#726c5c; --accent:#6d2a34; --accent2:#8f4550; --brass:#8a6d3a;
  --danger:#8f3a3a; --mystic:#4d4470; --teal:#2f6a63; --gray:#8b8577; --orange:#956433;
  --maxw:1180px; --serif:Georgia,"Nanum Myeongjo","Noto Serif KR",serif;
  --sans:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,sans-serif;
}
html[data-theme="dark"]{
  --bg:#15140f; --bg2:#1c1a14; --card:#211f18; --card-light:#26241c; --line:#3a362a;
  --ink:#efe9da; --ink2:#a89f8b; --accent:#c98a8f; --accent2:#e0aab0; --brass:#c9a35d;
  --danger:#c98a8f; --mystic:#a79ad4; --teal:#6fb3a6; --gray:#a29b8a; --orange:#d1975c;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:.001ms !important;transition-duration:.001ms !important;} }
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.8;font-size:16px;transition:background .3s,color .3s;}
h1,h2,h3,h4{font-family:var(--serif);color:var(--ink);margin:0 0 .4em;font-weight:400;}
a{color:var(--accent);}
button{font-family:var(--sans);cursor:pointer;}
:focus-visible{outline:1px solid var(--accent);outline-offset:2px;}
.gold-rule{height:1px;width:56px;background:var(--accent);margin:.5em 0 1.4em;}
.sec-marker{display:flex;align-items:baseline;gap:14px;margin-bottom:2px;}
.sec-num{font-family:var(--serif);font-size:1.6rem;color:var(--line);font-style:italic;}
.sec-eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);}

header.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);}
.topbar-inner{max-width:var(--maxw);margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.brand{display:flex;flex-direction:column;margin-right:auto;}
.brand .title{font-family:var(--serif);font-size:1.2rem;letter-spacing:.02em;}
.brand .subtitle{font-size:.66rem;color:var(--ink2);letter-spacing:.18em;text-transform:uppercase;}
.top-links{display:flex;gap:20px;margin-right:10px;}
.top-links a{font-size:.86rem;color:var(--ink);text-decoration:none;}
.top-links a:hover{color:var(--accent);}
#themeBtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:50%;width:38px;height:38px;font-size:1.1rem;display:flex;align-items:center;justify-content:center;}
#themeBtn:hover{border-color:var(--accent);}

main{max-width:var(--maxw);margin:0 auto;padding:40px 20px 90px;}
.page-head{margin-bottom:40px;}
.page-head h1{font-size:2.2rem;}
.section-desc{color:var(--ink2);max-width:760px;margin-bottom:18px;}
.jump-links{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);margin-bottom:40px;}
.jump-links a{flex:1 1 auto;padding:10px 16px;font-size:.84rem;color:var(--ink);text-decoration:none;border-right:1px solid var(--line);}
.jump-links a:last-child{border-right:none;}
.jump-links a:hover{color:var(--accent);background:var(--card-light);}

.table-wrap{overflow-x:auto;border:1px solid var(--line);margin-bottom:50px;}
table.compare{width:100%;border-collapse:collapse;min-width:760px;font-size:.85rem;}
table.compare th, table.compare td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;}
table.compare th{color:var(--ink2);font-weight:400;letter-spacing:.04em;font-size:.76rem;text-transform:uppercase;}
table.compare tr:hover td{background:var(--card-light);}

.nation-block{border:1px solid var(--line);border-radius:12px;margin-bottom:56px;background:var(--card);
  overflow:hidden;box-shadow:0 6px 24px rgba(20,18,14,.06);scroll-margin-top:80px;}
.nation-header-band{display:flex;align-items:center;gap:18px;padding:28px 30px;
  background:linear-gradient(135deg, color-mix(in srgb, var(--nation-color,var(--accent)) 14%, var(--card)), var(--card));
  border-bottom:1px solid var(--line);}
.nation-monogram{flex-shrink:0;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--nation-color,var(--accent));color:#fff;font-family:var(--serif);font-size:1.5rem;}
.nation-head{display:flex;flex-direction:column;gap:4px;}
.nation-head h2{color:var(--nation-color,var(--ink));font-size:1.9rem;margin:0;}
.nation-body{padding:28px 30px 32px;}
.faction-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px;}
@media (max-width:800px){ .faction-row{grid-template-columns:repeat(2,1fr);} }
@media (max-width:460px){ .faction-row{grid-template-columns:1fr;} }
.faction-chip{border:1px solid var(--line);border-radius:8px;background:var(--card-light);color:var(--ink);
  padding:16px 14px;font-size:.9rem;font-family:var(--sans);display:flex;align-items:center;justify-content:center;text-align:center;min-height:56px;}
.faction-chip:hover{border-color:var(--nation-color,var(--accent));color:var(--nation-color,var(--accent));background:var(--card);}
.nation-tags{font-size:.78rem;color:var(--ink2);}
.placeholder-box{border:1px dashed var(--line);padding:14px;color:var(--ink2);font-size:.78rem;text-align:center;margin:14px 0;}
.nation-images{display:flex;gap:16px;margin:16px 0;flex-wrap:wrap;}
.nation-img{height:280px;width:auto;max-width:100%;border:1px solid var(--line);border-radius:8px;object-fit:cover;background:var(--card);}
@media (max-width:600px){ .nation-img{height:200px;} }
.subhead{font-size:1rem;color:var(--ink);margin:24px 0 10px;letter-spacing:.05em;border-bottom:1px solid var(--line);padding-bottom:6px;}

.accordion{border:1px solid var(--line);margin-bottom:8px;background:var(--card);}
.accordion-head{width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;font-size:.92rem;font-family:var(--sans);}
.accordion-head:hover{color:var(--accent);}
.accordion-head .chev{transition:transform .2s;color:var(--accent);font-size:.8rem;}
.accordion.open .accordion-head .chev{transform:rotate(90deg);}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .25s ease;background:var(--card-light);}
.accordion.open .accordion-body{max-height:2000px;}
.accordion-body-inner{padding:16px 18px;font-size:.89rem;border-top:1px solid var(--line);}
.field-label{color:var(--ink2);font-size:.74rem;}


/* Faction File Modal (larger) */
.modal-overlay{position:fixed;inset:0;background:rgba(8,8,12,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:300;padding:24px;}
.modal-overlay.show{display:flex;}
.modal-box{background:#1b1c22;border:1px solid #37334a;border-radius:6px;max-width:1080px;width:100%;max-height:92vh;overflow:auto;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.55);}
.modal-topline{height:4px;background:linear-gradient(90deg,#8774d8,#4d4470,#8774d8);}
.modal-header{padding:28px 70px 22px 32px;border-bottom:1px solid #2c2c36;position:relative;}
.modal-eyebrow{font-size:.78rem;letter-spacing:.2em;color:#8f7fe0;display:flex;align-items:center;gap:8px;margin-bottom:10px;text-transform:uppercase;font-weight:600;}
.modal-eyebrow .diamond{color:#8f7fe0;}
.modal-name{font-family:var(--serif);font-size:2.1rem;color:#c9baf0;}
.modal-close{position:absolute;top:22px;right:24px;width:38px;height:38px;background:#26242e;border:1px solid #3a3550;color:#cfcfe0;font-size:1.1rem;border-radius:4px;line-height:1;}
.modal-close:hover{background:#332f42;border-color:#8f7fe0;}
.modal-body{display:flex;flex-wrap:wrap;}
.modal-portrait{flex:0 0 340px;min-height:340px;background:linear-gradient(160deg,var(--pcolor,#8774d8) 0%,#1b1c22 130%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.modal-portrait img{width:100%;height:100%;object-fit:cover;display:block;}
.modal-portrait .sigil-letter{font-family:var(--serif);font-size:6rem;color:rgba(255,255,255,.88);}
.modal-info{flex:1 1 360px;padding:30px 34px;}
.modal-field{display:flex;gap:10px;font-size:.95rem;color:#8f8ba3;margin-bottom:13px;flex-wrap:wrap;}
.modal-field span{min-width:80px;}
.modal-field b{color:#b9a6ef;font-weight:600;}
.modal-desc{border-top:1px solid #2c2c36;margin-top:18px;padding-top:20px;font-size:1rem;color:#d8d5e6;line-height:2;}
@media (max-width:680px){
  .modal-body{flex-direction:column;}
  .modal-portrait{flex:0 0 auto;min-height:200px;}
}

footer{border-top:1px solid var(--line);padding:30px 20px;text-align:center;color:var(--ink2);font-size:.78rem;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="title">아르카디아 가이드</span>
      <span class="subtitle">Chronicles of Arcadia</span>
    </div>
    <div class="top-links">
      <a href="index.html">홈</a>
      <a href="characters.html">인물</a>
    </div>
    <button id="themeBtn" aria-label="테마 전환">☀️</button>
  </div>
</header>

<main>
  <div class="page-head">
    <div class="sec-marker"><span class="sec-num">III</span><span class="sec-eyebrow">Nations</span></div>
    <h1>대륙과 국가</h1>
    <div class="gold-rule"></div>
    <p class="section-desc">일곱 국가의 상세 설정과 주요 세력</p>
  </div>

  <div class="jump-links" id="jumpLinks"></div>

  <div id="nationDetails"></div>
</main>

<footer>아르카디아 가이드 · Chronicles of Arcadiaㅤㅤㅤㅤㅤ/ㅤㅤㅤㅤㅤDesigned by. 데굴데굴별똥별</footer>

<div class="modal-overlay" id="factionModalOverlay">
  <div class="modal-box" id="factionModalBox" role="dialog" aria-modal="true" aria-labelledby="fmName">
    <div class="modal-topline"></div>
    <div class="modal-header">
      <div class="modal-eyebrow"><span class="diamond">◆</span> FACTION FILE</div>
      <div class="modal-name" id="fmName"></div>
      <button class="modal-close" id="fmCloseBtn" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-portrait" id="fmPortrait"></div>
      <div class="modal-info" id="fmInfo"></div>
    </div>
  </div>
</div>

<script>
const COUNTRIES = [
{
  id:'karte', name:'카르테 자유도시', type:'중립 상업도시', accent:'#8a6d3a',
  desc:'카르테 자유도시는 특정 왕가나 종족보다 거래와 자유를 중심으로 운영되는 중립 상업도시다. 다양한 국가와 종족의 상인, 용병, 정보상, 귀족, 여행자들이 모인다. 번화한 거리와 시장, 경매장, 술집, 사교 살롱이 존재하며, 돈과 정보가 도시의 흐름을 움직인다. 자유도시라는 이름과 달리 모든 사람이 완전히 자유로운 것은 아니며, 거래와 계약, 약점과 욕망, 정보와 권력이 사람들의 관계를 결정하기도 한다.',
  factions:[],
},
{
  id:'lumen', name:'루멘 왕국', type:'신앙 중심의 오래된 왕국', accent:'#c7c7ab',
  desc:'루멘 왕국은 신앙을 중심으로 발전한 아르카디아의 오래된 왕국이다. 성당, 성유물, 기도, 계시, 신성력과 관련된 문화가 발달했으며, 왕국의 정치와 사회에서도 신앙이 큰 영향력을 가진다. 그러나 루멘 왕국의 모든 세력이 같은 방식으로 신을 믿는 것은 아니다. 신앙을 적극적으로 전파하려는 세력, 침묵 속에서 기록과 비밀을 지키려는 세력, 계시와 징조를 해석하는 세력, 신과 신성 그 자체를 부정하거나 제거하려는 세력이 함께 존재한다. 겉으로는 성스럽고 질서정연한 왕국이지만, 내부에는 신앙의 의미를 둘러싼 깊은 갈등이 존재한다.',
  factions:[
{name:'성광회', img:'images/factions/성광회.png', image:'성광, 신성력, 정통 신앙', role:'신을 연모하며 그들을 찾아내는 집단', note:'루멘 왕국의 정통 신앙 세력으로 성기사단과 대성당을 중심으로 신의 흔적과 유산을 찾아 나서는 조직이다.'},
{name:'침묵회', img:'images/factions/침묵회.png', image:'학자, 귀족, 현실주의', role:'신은 이미 죽었다고 여기며 과거를 잊으려는 집단', note:'지나간 신앙보다 국가의 부상을 우선시하는 학자와 귀족 중심의 세력으로, 신을 향한 미련을 버리고 실리를 추구한다.'},
{name:'계시회', img:'images/factions/계시회.png', image:'젊은 사제, 예언자, 새로운 신앙', role:'새로운 신을 찾으려는 급부상 세력', note:'기존 신앙 체계에 의문을 품고 새로운 신을 찾아 나서는 젊은 사제와 예언자들이 모인, 최근 빠르게 세를 넓히고 있는 조직이다.'},
{name:'신살회', img:'images/factions/신살회.png', image:'암살자, 이단, 비밀 결사', role:'우리가 신을 죽였다고 주장하는 세력', note:'공개적으로 활동하지 않으나 암살자와 이단자들이 주축이 되어 신의 실종에 스스로 책임이 있다고 주장하는 은밀한 집단이다.'},
  ],
},
{
  id:'valhar', name:'발하르 제국', type:'인간 중심의 군사 제국', accent:'#8f3a3a',
  desc:'발하르 제국은 강력한 군사력과 중앙 권력을 기반으로 성장한 인간 제국이다. 제국 내부에는 황실을 지지하는 황실파, 귀족들의 권한을 중시하는 귀족연합, 기존 체제를 무너뜨리려는 혁명동맹, 과거의 전통과 정통성을 되찾으려는 복고주의자가 존재한다. 각 세력은 제국의 미래를 다르게 바라본다. 이들의 갈등은 단순히 선과 악의 대립이 아니라, 권력과 질서, 혁명, 전통, 생존을 둘러싼 정치적 대립이다.',
  factions:[
{name:'황실파', img:'images/factions/황실파.png', image:'황실, 제복, 국가 권력', role:'제국의 안정이 최우선이라 여기는 세력', note:'초대 황제 서거 이후 약해진 황권을 지켜내려는 황실 측근들로 구성된 세력이다.'},
{name:'귀족연합', img:'images/factions/귀족연합.png', image:'귀족, 영지, 권력 다툼', role:'약해진 권력을 좌시하지 않으려는 귀족 연합', note:'황권이 흔들리는 틈을 타 권력을 탐하는 귀족들이 모인 연합으로, 제국 내 정치적 긴장을 키우고 있다.'},
{name:'혁명동맹', img:'images/factions/혁명동맹.png', image:'평민, 상인, 체제 전복', role:'시대가 변했다고 외치는 세력', note:'평민과 상인들이 하나둘 모여 기존 권력 구조를 뒤바꾸려 하는 세력으로, 목적을 위해 과격한 수단도 서슴지 않는다.'},
{name:'복고주의자', img:'images/factions/복고주의자.png', image:'낡은 신앙, 배척받는 자들, 기다림', role:'언젠가 신이 돌아올 것이라 믿는 세력', note:'제국의 다른 세력들에게 가장 배척받지만, 신의 귀환을 굳게 믿으며 옛 신앙을 지켜나가는 이들이다.'},
  ],
},
{
  id:'academia', name:'아카데미아 연방', type:'마법사와 학문 중심의 연방 국가', accent:'#4d4470',
  desc:'아카데미아 연방은 마법사, 연구자, 교수, 학생, 마도공학자들이 활동하는 학문 중심의 국가다. 국가 내부에는 진리탑, 관측회, 초월회, 금서회 네 개의 대표적인 조직이 존재하며, 이들은 모두 마법과 진리를 다루지만 지식을 대하는 방식과 허용하는 연구의 범위가 다르다. 대표 이야기 「마법은 시험에 나오지 않는다」의 배경이며, 이미 다수의 캐릭터가 존재하므로 새로운 인물을 임의로 추가하지 않는다.',
  factions:[
{name:'진리탑', img:'images/factions/진리탑.png', image:'정통 학파, 지식 공유, 연구탑', role:'지식은 모두의 것이라 믿는 정통 학파', note:'모든 인간에게 지식을 전해야 한다고 주장하는 아카데미아의 정통 학파로, 공개적인 연구와 교육을 중시한다.'},

function renderJumpLinks(){
  document.getElementById('jumpLinks').innerHTML = COUNTRIES.map(c=>`<a href="#nation-${c.id}">${c.name}</a>`).join('');
}

function renderNationDetails(){
  const wrap = document.getElementById('nationDetails');
  wrap.innerHTML = COUNTRIES.map(c=>{
    const factionsBlock = c.factions.length ? `
      <h3 class="subhead">주요 세력</h3>
      <div class="faction-row">
        ${c.factions.map((f,i)=>`
          <button class="faction-chip" style="--nation-color:${c.accent}" onclick="openFactionModal('${c.id}',${i})">${f.name}</button>
        `).join('')}
      </div>
    ` : '';

    return `<div class="nation-block" id="nation-${c.id}" style="--nation-color:${c.accent}">
      <div class="nation-header-band">
        <div class="nation-monogram">${c.name.charAt(0)}</div>
        <div class="nation-head">
          <h2>${c.name}</h2>
          <span class="nation-tags">${c.type}</span>
        </div>
      </div>
      <div class="nation-body">
        <div class="nation-images">
          <img class="nation-img" src="images/nations/${c.id}-flag.png" alt="${c.name} 국기" onerror="this.style.display='none'">
          <img class="nation-img" src="images/nations/${c.id}-emblem.png" alt="${c.name} 문장" onerror="this.style.display='none'">
        </div>
        <p>${c.desc}</p>
        ${factionsBlock}
      </div>
    </div>`;
  }).join('');
}

function openFactionModal(countryId, idx){
  const country = COUNTRIES.find(c=>c.id===countryId);
  const f = country.factions[idx];
  document.getElementById('fmName').textContent = f.name;
  const portrait = document.getElementById('fmPortrait');
  portrait.style.setProperty('--pcolor', country.accent);
  if(f.img){
    // 이미지 파일이 있으면 표시하고, 없으면(로딩 실패) 자동으로 이니셜로 대체
    portrait.innerHTML = `<img src="${f.img}" alt="${f.name}" onerror="this.parentElement.innerHTML='<span class=&quot;sigil-letter&quot;>${f.name.charAt(0)}</span>'">`;
  } else {
    // 이미지가 없으면 국가 색 그라데이션 + 이니셜 글자로 대체 표시
    portrait.innerHTML = `<span class="sigil-letter">${f.name.charAt(0)}</span>`;
  }
  document.getElementById('fmInfo').innerHTML = `
    <div class="modal-field"><span>소속 국가</span><b>${country.name}</b></div>
    <div class="modal-field"><span>키워드</span><b>${f.image||'미정'}</b></div>
    ${f.role?`<div class="modal-field"><span>역할</span><b>${f.role}</b></div>`:''}
    ${f.figure?`<div class="modal-field"><span>대표 인물</span><b>${f.figure}</b></div>`:''}
    <div class="modal-desc">${f.note || '아직 확정된 서술이 없다.'}</div>
  `;
  document.getElementById('factionModalOverlay').classList.add('show');
}
function closeFactionModal(){
  document.getElementById('factionModalOverlay').classList.remove('show');
}
document.getElementById('fmCloseBtn').addEventListener('click', closeFactionModal);
document.getElementById('factionModalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'factionModalOverlay') closeFactionModal();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeFactionModal();
});

const themeBtn = document.getElementById('themeBtn');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('arcadia_theme_ed', t);
  themeBtn.textContent = t==='dark' ? '🌕' : '☀️';
}
themeBtn.addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur==='light' ? 'dark' : 'light');
});
applyTheme(localStorage.getItem('arcadia_theme_ed') || 'light');

renderJumpLinks();
renderNationDetails();
</script>

</html>
