<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인물 기록 — 아르카디아 가이드</title>
<style>
:root{
  --bg:#f2f1ec; --bg2:#eae8df; --card:#fbfaf6; --card-light:#f4f2ea; --line:#ddd7c6;
  --ink:#201d18; --ink2:#726c5c; --accent:#6d2a34; --accent2:#8f4550; --brass:#8a6d3a;
  --danger:#8f3a3a; --mystic:#4d4470; --teal:#2f6a63; --gray:#8b8577; --orange:#956433;
  --maxw:1180px; --serif:Georgia,"Nanum Myeongjo","Noto Serif KR",serif;
  --sans:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,sans-serif;
}
html[data-theme="dark"]{
  --bg:#15140f; --bg2:#1c1a14; --card:#211f18; --card-light:#26241c; --line:#3a362a;
  --ink:#efe9da; --ink2:#a89f8b; --accent:#c98a8f; --accent2:#e0aab0; --brass:#c9a35d;
  --danger:#c98a8f; --mystic:#a79ad4; --teal:#6fb3a6; --gray:#a29b8a; --orange:#d1975c;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:.001ms !important;transition-duration:.001ms !important;} }
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.8;font-size:16px;transition:background .3s,color .3s;}
h1,h2,h3{font-family:var(--serif);color:var(--ink);margin:0 0 .4em;font-weight:400;}
a{color:var(--accent);}
button{font-family:var(--sans);cursor:pointer;}
:focus-visible{outline:1px solid var(--accent);outline-offset:2px;}
.badge{display:inline-block;font-size:.68rem;padding:2px 8px;border-radius:2px;letter-spacing:.03em;border:1px solid;white-space:nowrap;}
.badge-undecided{color:var(--mystic);border-color:var(--mystic);}
.gold-rule{height:1px;width:56px;background:var(--accent);margin:.5em 0 1.4em;}
.sec-marker{display:flex;align-items:baseline;gap:14px;margin-bottom:2px;}
.sec-num{font-family:var(--serif);font-size:1.6rem;color:var(--line);font-style:italic;}
.sec-eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);}

header.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);}
.topbar-inner{max-width:var(--maxw);margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.brand{display:flex;flex-direction:column;margin-right:auto;}
.brand .title{font-family:var(--serif);font-size:1.2rem;letter-spacing:.02em;}
.brand .subtitle{font-size:.66rem;color:var(--ink2);letter-spacing:.18em;text-transform:uppercase;}
.top-links{display:flex;gap:20px;margin-right:10px;}
.top-links a{font-size:.86rem;color:var(--ink);text-decoration:none;}
.top-links a:hover{color:var(--accent);}
#themeBtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:50%;width:38px;height:38px;font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
#themeBtn:hover{border-color:var(--accent);}

main{max-width:var(--maxw);margin:0 auto;padding:40px 20px 90px;}
.page-head{margin-bottom:30px;}
.page-head h1{font-size:2.2rem;}

.no-result{display:none;color:var(--ink2);padding:20px;border:1px dashed var(--line);text-align:center;}
.no-result.show{display:block;}

.tab-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.tab-btn{background:var(--card);border:1px solid var(--line);color:var(--ink2);padding:9px 16px;font-size:.82rem;border-radius:3px;}
.tab-btn:hover{color:var(--accent);border-color:var(--accent);}
.tab-btn.active{color:var(--ink);border-color:var(--ink);background:var(--card-light);font-weight:600;}

.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.gallery-card{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card);cursor:pointer;}
.gallery-portrait{position:relative;aspect-ratio:3/4;background:linear-gradient(165deg,var(--pcolor,var(--accent)) 0%,var(--card-light) 130%);}
.gallery-portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.gallery-corner-wrap{position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:6px;}
.gallery-corner{padding:3px 9px;border-radius:20px;background:rgba(0,0,0,.55);color:#fff;font-size:.66rem;
  letter-spacing:.03em;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.35);font-family:var(--sans);}
.gallery-icon-circle{width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;font-weight:600;
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.35);font-family:var(--sans);flex-shrink:0;}
.gallery-overlay{position:absolute;left:0;right:0;bottom:0;padding:12px 12px 10px;background:linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0));}
.gallery-overlay .gname{font-family:var(--serif);font-size:1.05rem;color:#fff;line-height:1.2;}
.gallery-overlay .grole{font-size:.72rem;color:rgba(255,255,255,.82);margin-top:2px;}

/* Character File Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(8,8,12,.58);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:340;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:#1b1c22;border:1px solid #37334a;border-radius:6px;max-width:920px;width:100%;max-height:90vh;overflow:auto;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.55);}
.modal-topline{height:3px;background:linear-gradient(90deg,#8774d8,#4d4470,#8774d8);}
.modal-header{padding:22px 60px 18px 26px;border-bottom:1px solid #2c2c36;position:relative;}
.modal-eyebrow{font-size:.72rem;letter-spacing:.18em;color:#8f7fe0;display:flex;align-items:center;gap:7px;margin-bottom:8px;text-transform:uppercase;font-weight:600;}
.modal-eyebrow .diamond{color:#8f7fe0;}
.modal-name{font-family:var(--serif);font-size:1.7rem;color:#c9baf0;}
.modal-close{position:absolute;top:18px;right:20px;width:34px;height:34px;background:#26242e;border:1px solid #3a3550;color:#cfcfe0;font-size:1rem;border-radius:4px;line-height:1;}
.modal-close:hover{background:#332f42;border-color:#8f7fe0;}
.modal-body{display:flex;flex-wrap:wrap;}
.modal-portrait{flex:0 0 280px;aspect-ratio:3/4;background:linear-gradient(160deg,var(--pcolor,#8774d8) 0%,#1b1c22 130%);
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.modal-portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.modal-portrait .sigil-letter{font-size:4.5rem;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
.modal-info{flex:1 1 320px;padding:24px 28px;}
.modal-field{display:flex;gap:8px;font-size:.86rem;color:#8f8ba3;margin-bottom:10px;flex-wrap:wrap;}
.modal-field span{min-width:36px;}
.modal-field b{color:#b9a6ef;font-weight:600;}
.modal-desc{border-top:1px solid #2c2c36;margin-top:16px;padding-top:18px;font-size:.92rem;color:#d8d5e6;line-height:2;}
@media (max-width:640px){
  .modal-body{flex-direction:column;}
  .modal-portrait{flex:0 0 auto;aspect-ratio:16/10;}
}

/* 무소속 - 신들 포털 카드 */
.category-card{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);cursor:pointer;
  aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  background:radial-gradient(circle at 50% 30%, #3a2f5c 0%, #16131f 75%);max-width:230px;}
.category-card:hover{border-color:#b9a6ef;}
.category-card .cat-icon{font-size:2.2rem;}
.category-card .cat-name{font-family:var(--serif);font-size:1.15rem;color:#e8dfff;}
.category-card .cat-sub{font-size:.72rem;color:#9a8fc4;letter-spacing:.1em;}

/* 신 그리드용 카드 - 기존 갤러리 카드 구조 재사용, 크기만 살짝 키움 */
.god-grid .gallery-card{min-height:0;}
/* 신 포털 팝업 - 신들 카드 클릭 시 가운데에 모션과 함께 뜨는 팝업 */
@keyframes portalEnter{
  from{opacity:0; transform:scale(.92) translateY(14px);}
  to{opacity:1; transform:scale(1) translateY(0);}
}
.god-portal-overlay{position:fixed;inset:0;background:rgba(5,4,10,.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:320;padding:20px;overflow:hidden;}
.god-portal-overlay-bg{position:absolute;inset:0;z-index:0;opacity:.45;transition:opacity .3s ease;}
.god-portal-overlay-bg svg{width:100%;height:100%;object-fit:cover;}
.god-portal-overlay.show{display:flex;}
.god-portal-box{background:#141018;border:1px solid #3a3550;border-radius:12px;max-width:360px;width:100%;max-height:88vh;
  position:relative;z-index:1;overflow-x:hidden;overflow-y:auto;animation:portalEnter .35s ease;
  transition:transform .22s cubic-bezier(.36,0,.66,-0.02), opacity .18s ease;}
.god-portal-topline{height:3px;background:linear-gradient(90deg,#8774d8,#f0d58a,#8774d8);position:relative;z-index:1;}
.god-portal-header{padding:26px 50px 6px;text-align:center;position:relative;z-index:1;}
.god-portal-eyebrow{font-size:.72rem;letter-spacing:.3em;color:#b9a6ef;text-transform:uppercase;margin-bottom:8px;}
.god-portal-title{font-family:var(--serif);font-size:1.6rem;color:#e8dfff;}
.god-portal-close{position:absolute;top:18px;right:18px;width:34px;height:34px;background:rgba(185,166,239,.1);border:1px solid #3a3550;
  color:#c9baf0;font-size:1rem;border-radius:50%;line-height:1;z-index:2;}
.god-portal-close:hover{background:rgba(185,166,239,.22);}
.god-portal-grid{padding:16px 26px 20px;position:relative;z-index:1;}
.god-portal-stage{position:relative;max-width:280px;margin:0 auto;aspect-ratio:3/4;overflow:hidden;border-radius:8px;}
.god-portal-stage .gallery-card{width:100%;height:100%;}
.god-portal-nav-btn{position:fixed;top:50%;transform:translateY(-50%);background:rgba(185,166,239,.08);border:1px solid #3a3550;color:#c9baf0;
  width:46px;height:46px;border-radius:50%;font-size:1.2rem;z-index:330;}
.god-portal-nav-btn:hover{background:rgba(185,166,239,.2);}
#godPortalPrevBtn{left:26px;}
#godPortalNextBtn{right:26px;}
@media (max-width:640px){
  .god-portal-nav-btn{width:38px;height:38px;font-size:1rem;}
  #godPortalPrevBtn{left:8px;}
  #godPortalNextBtn{right:8px;}
}

footer{border-top:1px solid var(--line);padding:30px 20px;text-align:center;color:var(--ink2);font-size:.78rem;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="title">아르카디아 가이드</span>
      <span class="subtitle">Chronicles of Arcadia</span>
    </div>
    <div class="top-links">
      <a href="index.html">홈</a>
      <a href="nations.html">국가</a>
    </div>
    <button id="themeBtn" aria-label="테마 전환">☀️</button>
  </div>
</header>

<main>
  <div class="page-head">
    <div class="sec-marker"><span class="sec-num">IV</span><span class="sec-eyebrow">Character Records</span></div>
    <h1>인물 기록</h1>
    <div class="gold-rule"></div>
  </div>

  <div class="tab-bar" id="countryTabs"></div>
  <div id="peopleGrid"></div>
  <div class="no-result" id="peopleNoResult">해당 조건에 맞는 인물이 없습니다.</div>
</main>

<footer>아르카디아 가이드 · Chronicles of Arcadiaㅤㅤㅤㅤㅤ/ㅤㅤㅤㅤㅤDesigned by. 데굴데굴별똥별</footer>

<div class="modal-overlay" id="charModalOverlay">
  <div class="modal-box" id="charModalBox" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal-topline"></div>
    <div class="modal-header">
      <div class="modal-eyebrow"><span class="diamond">◆</span> CHARACTER FILE</div>
      <div class="modal-name" id="modalName"></div>
      <button class="modal-close" id="modalCloseBtn" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-portrait" id="modalPortrait"></div>
      <div class="modal-info" id="modalInfo"></div>
    </div>
  </div>
</div>

<div class="god-portal-overlay" id="godPortalOverlay">
  <div class="god-portal-overlay-bg" id="godPortalBg"></div>
  <button class="god-portal-nav-btn" id="godPortalPrevBtn" aria-label="이전 신">◀</button>
  <div class="god-portal-box" id="godPortalBox" role="dialog" aria-modal="true" aria-labelledby="godPortalTitle">
    <div class="god-portal-topline"></div>
    <button class="god-portal-close" id="godPortalCloseBtn" aria-label="닫기">✕</button>
    <div class="god-portal-header">
      <div class="god-portal-eyebrow">✦ 신들의 기록 ✦</div>
      <div class="god-portal-title" id="godPortalTitle">신들</div>
    </div>
    <div class="god-portal-grid"><div class="god-portal-stage" id="godPortalStage"></div></div>
  </div>
  <button class="god-portal-nav-btn" id="godPortalNextBtn" aria-label="다음 신">▶</button>
</div>

<script>
const COUNTRIES = [
  {id:'karte', name:'카르테 자유도시', accent:'#8a6d3a'},
  {id:'lumen', name:'루멘 왕국', accent:'#c7c7ab'},
  {id:'valhar', name:'발하르 제국', accent:'#8f3a3a'},
  {id:'academia', name:'아카데미아 연방', accent:'#4d4470'},
  {id:'noctur', name:'노크투르 연맹', accent:'#5c3560'},
  {id:'silvania', name:'실바니아 숲 왕국', accent:'#2f6a63'},
  {id:'draconia', name:'드래코니아 산악국', accent:'#956433'}
];

const CHARACTERS = [
  {name:'미냐', img:'images/characters/미냐.png', icon:'💰', age:'21세 여성 · 인간', country:'karte', class:'CLASS 0', appear:'ARCADIA', personality:'장난스러움', job:'장난스런 트릭스터', desc:'카르테 자유 도시의 장난스런 트릭스터이자 정보상.<br>전투에 대해서는 연관이 없기에 항상 연막을 들고 잘 도망친다.'},

  {name:'비비안', img:'images/characters/비비안.png', icon:'💰', age:'24세 여성 · 인간', country:'karte', class:'CLASS 1', appear:'ARCADIA', personality:'사교적', job:'정보 브로커', desc:'카르테 자유 도시의 정보 브로커.<br>누구에게나 잘 다가가며, 정보를 슬쩍 훔친다.<br>간단한 단검술을 쓸 줄 아는듯 하다.'},

  {name:'렌', img:'images/characters/렌.png', icon:'💰', age:'27세 남성 · 인간', country:'karte', class:'CLASS 5', appear:'ARCADIA', personality:'침착함, 침묵적', job:'경호 무투가', desc:'카르테 자유 도시의 유명한 무투가.<br>계약을 철저히 지키며 사적인 감정을 일에 섞지 않는다.<br>[청류권]을 사용할 줄 알며, 상대를 넘어트리는 체술에 능하다.'},

  {name:'리아나', img:'images/characters/리아나.png', icon:'✨', age:'23세 여성 · 인간', country:'lumen', class:'CLASS 5', appear:'ARCADIA', personality:'냉정함', job:'질서의 검', desc:'성광회의 질서의 검.<br>임무와 질서를 우선시하는 성기사 장교.<br>[성휘검술]을 사용하며, 정화·수호·결계 돌파에 능하다.'},

  {name:'바렌테', img:'images/characters/바렌테.png', icon:'✨', age:'25세 여성 · 인간', country:'lumen', class:'CLASS 4', appear:'ARCADIA', personality:'냉정함', job:'백은 집행관', desc:'성광회의 백은 집행관.<br>질서와 책임을 우선하는 지휘관.<br>[성정장막]을 사용하며, 저주와 이단 마력을 약화시킨다.'},

  {name:'루미에르', img:'images/characters/루미에르.png', icon:'🌙', age:'26세 여성 · 인간', country:'lumen', class:'CLASS 4', appear:'ARCADIA', personality:'침착함', job:'제2왕녀', desc:'침묵회를 후원하는 제2왕녀.<br>왕실의 권한과 정치적 영향력을 이용하는 후원자.<br>[묵성인]을 사용하며, 성인을 전개해 적의 행동을 제한시킨다.'},

  {name:'엘루아', img:'images/characters/엘루아.png', icon:'🌙', age:'24세 여성 · 인간', country:'lumen', class:'CLASS 1', appear:'ARCADIA', personality:'단정함, 품위 있음', job:'신앙정책 사상가', desc:'침묵회의 신앙정책 사상가.<br>귀족 정치와 예산 분석, 기록 해석에 뛰어나다.<br>[서약문]을 사용하며, 성문을 펼쳐 일정 범위의 마법을 약화시킨다.'},

  {name:'엘리시아', img:'images/characters/엘리시아.png', icon:'⭐', age:'25세 여성 · 인간', country:'lumen', class:'CLASS 3', appear:'ARCADIA', personality:'부드러움, 설득력', job:'징조 해석자', desc:'계시회의 징조 해석자.<br>기도와 꿈, 성유물의 반응, 별빛의 징조를 읽는다.<br>[상성기도]를 사용하며, 치유와 지원, 광역 제압에 능하다.'},

  {name:'아르카일', img:'images/characters/아르카일.png', icon:'☠️', age:'26세 여성 · 인간', country:'lumen', class:'CLASS 6', appear:'ARCADIA', personality:'냉정함, 조용함', job:'월식 암살자', desc:'신살회의 월식 암살자.<br>[월식성흔]을 사용하며, 신성력의 연결을 끊고 성유물 반응과 계시 의식을 약화시킨다.'},

{name:'이안', img:'images/characters/이안.png', icon:'👑', age:'28세 남성 · 인간', country:'valhar', class:'CLASS 2', appear:'ARCADIA', personality:'냉정함, 현실적', job:'전략행정관', desc:'황실파 전략행정관.<br>[빙류장막]으로 마력의 흔적을 추적하며 문서 조작과 잠입자를 밝혀낸다.'},

    svgBg:'<svg class="god-svg-bg" viewBox="0 0 200 266" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="ordGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#050505"/><stop offset="49.5%" stop-color="#050505"/><stop offset="50.5%" stop-color="#e8e8ec"/><stop offset="100%" stop-color="#e8e8ec"/></linearGradient><style>.poof{opacity:0;animation:poofpop 3s ease-in-out infinite;}@keyframes poofpop{0%{opacity:0;transform:scale(.2);}8%{opacity:1;transform:scale(1.15);}14%{opacity:1;transform:scale(1);}70%{opacity:1;transform:scale(1);}80%{opacity:0;transform:scale(.6);}100%{opacity:0;transform:scale(.6);}}</style></defs><rect width="200" height="266" fill="url(#ordGrad)"/><g stroke="#e8e8ec" stroke-width="0.9"><path class="poof" d="M8,42 L34,14" style="animation-delay:0s;transform-origin:21px 28px;"/><path class="poof" d="M12,64 L46,30" style="animation-delay:.4s;transform-origin:29px 47px;"/><path class="poof" d="M4,92 L28,64" style="animation-delay:.8s;transform-origin:16px 78px;"/><path class="poof" d="M18,110 L40,86" style="animation-delay:1.2s;transform-origin:29px 98px;"/></g><g stroke="#050505" stroke-width="0.9"><rect class="poof" x="138" y="38" width="14" height="14" style="animation-delay:.2s;transform-origin:145px 45px;"/><rect class="poof" x="163" y="58" width="10" height="10" style="animation-delay:.6s;transform-origin:168px 63px;"/><circle class="poof" cx="150" cy="98" r="8" fill="none" style="animation-delay:1s;transform-origin:150px 98px;"/><rect class="poof" x="140" y="115" width="9" height="9" style="animation-delay:1.4s;transform-origin:144.5px 119.5px;"/></g><circle cx="100" cy="133" r="34" fill="none" stroke="#8a6a2f" stroke-width="1.2" opacity="0.65"/><circle cx="100" cy="133" r="4" fill="#8a6a2f" opacity="0.7"/></svg>'
  }
];

function countryName(id){ if(id==='unaffiliated') return '무소속'; const c = COUNTRIES.find(x=>x.id===id); return c ? c.name : '미정'; }
function field(val){ return (!val || val==='미정') ? '<span class="badge badge-undecided">미정</span>' : val; }

let activeTab = 'all';

function renderCountryTabs(){
  const wrap = document.getElementById('countryTabs');
  const tabs = [{id:'all', name:'전체'}, ...COUNTRIES, {id:'unaffiliated', name:'무소속'}];
  wrap.innerHTML = tabs.map(t=>`<button class="tab-btn${t.id===activeTab?' active':''}" data-tab="${t.id}">${t.name}</button>`).join('');
  wrap.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeTab = btn.getAttribute('data-tab');
      wrap.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b===btn));
      renderPeople();
    });
  });
}

function roleLine(p){
  if(p.job && p.job!=='미정') return p.job.split(',')[0].split('·')[0].trim();
  if(p.ability && p.ability!=='-' && p.ability!=='미정') return p.ability.split('·')[0].trim();
  return '정보 미정';
}

/* 파일명 인코딩 방식(NFC/NFD)이 기기마다 달라서 이미지가 안 뜰 수 있다.
   먼저 원래 경로로 시도하고, 실패하면 정규화(NFD)한 경로로 한 번 더 시도한다. */
function imgFallback(el){
  if(el.dataset.nfdTried){ el.style.display = 'none'; return; }
  el.dataset.nfdTried = '1';
  const alt = el.dataset.orig.normalize('NFD');
  if(alt === el.getAttribute('src')){ el.style.display = 'none'; return; }
  el.src = alt;
}

function classLabel(c){
  if(c===undefined || c===null || c==='' || c==='미정') return 'CLASS ?';
  if(typeof c === 'number') return 'CLASS '+c;
  return c;
}

let CHAR_INDEX = [];
function personCardHTML(p, idx){
  const accent = p.accent || COUNTRIES.find(c=>c.id===p.country)?.accent || '#6d2a34';
  return `<div class="gallery-card" onclick="openCharacterModal(${idx})">
    <div class="gallery-portrait" style="--pcolor:${accent}">
      <img src="${p.img||''}" data-orig="${p.img||''}" alt="${p.name}" onerror="imgFallback(this)">
      <div class="gallery-corner-wrap">
        <div class="gallery-corner">${classLabel(p.class)}</div>
        <div class="gallery-icon-circle">${p.icon || ''}</div>
      </div>
      <div class="gallery-overlay">
        <div class="gname">${p.name}</div>
        <div class="grole">${roleLine(p)}</div>
      </div>
    </div>
  </div>`;
}

/* 신 그리드용 카드 - personCardHTML과 동일한 구조, 클릭 시 전용 신 모달을 엶 */
function godCardHTML(g, idx){
  return `<div class="gallery-card" onclick="openGodFromPortal(${idx})">
    <div class="gallery-portrait" style="--pcolor:${g.accent}">
      <img src="${g.img||''}" data-orig="${g.img||''}" alt="${g.name}" onerror="imgFallback(this)">
      <div class="gallery-corner-wrap">
        <div class="gallery-corner">${classLabel(g.class)}</div>
        <div class="gallery-icon-circle">${g.icon || ''}</div>
      </div>
      <div class="gallery-overlay">
        <div class="gname">${g.name}</div>
        <div class="grole">${g.affiliation}</div>
      </div>
    </div>
  </div>`;
}

function buildDescText(p){
  return p.desc || '아직 확정된 서술이 없다.';
}

function openCharacterModal(idx){
  const p = CHAR_INDEX[idx];
  const accent = p.accent || COUNTRIES.find(c=>c.id===p.country)?.accent || '#8774d8';
  document.getElementById('modalName').textContent = p.name;
  const portrait = document.getElementById('modalPortrait');
  portrait.style.setProperty('--pcolor', accent);
  portrait.innerHTML = `${p.svgBg || ''}<span class="sigil-letter" id="modalSigil" style="display:none;position:relative;z-index:1;">${p.icon || p.name.charAt(0)}</span><img src="${p.img||''}" alt="${p.name}" id="modalPortraitImg" style="position:relative;z-index:1;">`;

  const imgEl = document.getElementById('modalPortraitImg');
  const sigilEl = document.getElementById('modalSigil');
  let nfdTried = false;
  imgEl.onerror = function(){
    if(!nfdTried && p.img){
      nfdTried = true;
      const alt = p.img.normalize('NFD');
      if(alt !== this.getAttribute('src')){ this.src = alt; return; }
    }
    this.style.display = 'none';
    sigilEl.style.display = 'flex';
  };
  imgEl.onload = function(){
    sigilEl.style.display = 'none';
  };

  document.getElementById('modalInfo').innerHTML = `
    <div class="modal-field"><span>소속</span><b>${p.affiliation || countryName(p.country)}</b></div>
    <div class="modal-field"><span>등장</span><b>${field(p.appear)}</b></div>
    <div class="modal-field"><span>나이</span><b>${field(p.age)}</b></div>
    <div class="modal-field"><span>성향</span><b>${field(p.personality)}</b></div>
    <div class="modal-desc">${buildDescText(p)}</div>
  `;
  document.getElementById('charModalOverlay').classList.add('show');
}
function closeCharacterModal(){
  document.getElementById('charModalOverlay').classList.remove('show');
}
document.getElementById('modalCloseBtn').addEventListener('click', closeCharacterModal);
document.getElementById('charModalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'charModalOverlay') closeCharacterModal();
});

/* 무소속 - 신들: 1단계(포털 카드) → 2단계(가운데 팝업, 신 카드 한 장씩 넘기기) → 3단계(기존 CHARACTER FILE 모달) */
let currentGodIndex = 0;
let godSliding = false;
function renderGodPortalCard(){
  CHAR_INDEX = GODS;
  const g = GODS[currentGodIndex];
  document.getElementById('godPortalStage').innerHTML = godCardHTML(g, currentGodIndex);
  document.getElementById('godPortalBg').innerHTML = g.svgBg || '';
}
function openGodPortal(){
  currentGodIndex = 0;
  renderGodPortalCard();
  document.getElementById('godPortalOverlay').classList.add('show');
}
function closeGodPortal(){
  document.getElementById('godPortalOverlay').classList.remove('show');
  renderPeople(); // CHAR_INDEX가 신 목록으로 바뀌어 있으므로 현재 탭에 맞게 다시 복구
}
function nextGodPortal(){ slideGodPortal('next'); }
function prevGodPortal(){ slideGodPortal('prev'); }
function slideGodPortal(direction){
  if(godSliding) return;
  godSliding = true;
  const stage = document.getElementById('godPortalStage');
  const oldCard = stage.querySelector('.gallery-card');
  const nextIndex = direction==='next'
    ? (currentGodIndex + 1) % GODS.length
    : (currentGodIndex - 1 + GODS.length) % GODS.length;
  const newGod = GODS[nextIndex];

  const wrap = document.createElement('div');
  wrap.innerHTML = godCardHTML(newGod, nextIndex);
  const newCard = wrap.firstElementChild;

  const outX = direction==='next' ? '-100%' : '100%';
  const inX = direction==='next' ? '100%' : '-100%';
  const transitionStyle = 'transform .32s cubic-bezier(.36,0,.66,-0.02), opacity .22s ease';

  [oldCard, newCard].forEach(c=>{
    c.style.position = 'absolute';
    c.style.top = '0';
    c.style.left = '0';
    c.style.width = '100%';
    c.style.height = '100%';
    c.style.transition = transitionStyle;
  });
  newCard.style.transform = `translateX(${inX})`;
  stage.appendChild(newCard);

  void newCard.offsetWidth; // 강제 리플로우 후 동시에 애니메이션 시작
  requestAnimationFrame(()=>{
    oldCard.style.transform = `translateX(${outX})`;
    newCard.style.transform = 'translateX(0)';
  });

  document.getElementById('godPortalBg').innerHTML = newGod.svgBg || '';

  setTimeout(()=>{
    currentGodIndex = nextIndex;
    oldCard.remove();
    newCard.style.position = '';
    newCard.style.top = '';
    newCard.style.left = '';
    newCard.style.width = '';
    newCard.style.height = '';
    newCard.style.transition = '';
    newCard.style.transform = '';
    godSliding = false;
  }, 340);
}
function openGodFromPortal(idx){
  const sourceBox = document.getElementById('godPortalBox');
  const sourceRect = sourceBox.getBoundingClientRect();

  openCharacterModal(idx); // godPortalOverlay는 그대로 뒤에 켜둔 채로 캐릭터 모달을 그 위에 띄운다

  const targetBox = document.getElementById('charModalBox');
  const targetRect = targetBox.getBoundingClientRect();

  const scaleX = sourceRect.width / targetRect.width;
  const scaleY = sourceRect.height / targetRect.height;
  const dx = (sourceRect.left + sourceRect.width/2) - (targetRect.left + targetRect.width/2);
  const dy = (sourceRect.top + sourceRect.height/2) - (targetRect.top + targetRect.height/2);

  targetBox.style.transition = 'none';
  targetBox.style.transform = `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})`;
  targetBox.style.opacity = '0.5';
  void targetBox.offsetWidth; // 강제 리플로우

  targetBox.style.transition = 'transform .4s cubic-bezier(.2,.8,.2,1), opacity .3s ease';
  requestAnimationFrame(()=>{
    targetBox.style.transform = 'translate(0,0) scale(1,1)';
    targetBox.style.opacity = '1';
  });

  setTimeout(()=>{
    targetBox.style.transition = '';
    targetBox.style.transform = '';
    targetBox.style.opacity = '';
  }, 420);
}
document.getElementById('godPortalCloseBtn').addEventListener('click', closeGodPortal);
document.getElementById('godPortalNextBtn').addEventListener('click', nextGodPortal);
document.getElementById('godPortalPrevBtn').addEventListener('click', prevGodPortal);
document.getElementById('godPortalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'godPortalOverlay') closeGodPortal();
});

/* 키보드 단축키: 항상 가장 위에 떠있는 화면만 반응하도록 우선순위대로 처리 */
document.addEventListener('keydown', (e)=>{
  const charShown = document.getElementById('charModalOverlay').classList.contains('show');
  const portalShown = document.getElementById('godPortalOverlay').classList.contains('show');
  if(charShown){
    if(e.key === 'Escape') closeCharacterModal();
    return;
  }
  if(portalShown){
    if(e.key === 'Escape') closeGodPortal();
    if(e.key === 'ArrowRight') nextGodPortal();
    if(e.key === 'ArrowLeft') prevGodPortal();
  }
});

function renderPeople(){
  if(activeTab === 'unaffiliated'){
    const unaffChars = CHARACTERS.filter(p=>p.country==='unaffiliated');
    CHAR_INDEX = unaffChars;
    const portalCard = `<div class="category-card" onclick="openGodPortal()">
        <div class="cat-icon">✦</div>
        <div class="cat-name">신들</div>
        <div class="cat-sub">THE FORGOTTEN GODS</div>
      </div>`;
    document.getElementById('peopleGrid').innerHTML = `<div class="gallery-grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr));">
      ${portalCard}${unaffChars.map((p,i)=>personCardHTML(p,i)).join('')}
    </div>`;
    document.getElementById('peopleNoResult').classList.remove('show');
    return;
  }
  const filtered = activeTab==='all' ? CHARACTERS : CHARACTERS.filter(p=>p.country===activeTab);
  CHAR_INDEX = filtered;
  const portalCardAll = activeTab==='all' ? `<div class="category-card" onclick="openGodPortal()">
      <div class="cat-icon">✦</div>
      <div class="cat-name">신들</div>
      <div class="cat-sub">THE FORGOTTEN GODS</div>
    </div>` : '';
  document.getElementById('peopleGrid').innerHTML = `<div class="gallery-grid">${portalCardAll}${filtered.map((p,i)=>personCardHTML(p,i)).join('')}</div>`;
  document.getElementById('peopleNoResult').classList.toggle('show', filtered.length===0);
}

const themeBtn = document.getElementById('themeBtn');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('arcadia_theme_ed', t);
  themeBtn.textContent = t==='dark' ? '🌕' : '☀️';
}
themeBtn.addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur==='light' ? 'dark' : 'light');
});
applyTheme(localStorage.getItem('arcadia_theme_ed') || 'light');

renderCountryTabs();
renderPeople();

/* URL 파라미터로 특정 인물 바로 열기: characters.html?char=이름 */
(function openFromUrlParam(){
  const params = new URLSearchParams(window.location.search);
  const targetName = params.get('char');
  if(!targetName) return;
  const target = CHARACTERS.find(p=>p.name===targetName);
  if(!target) return;
  activeTab = target.country;
  renderCountryTabs();
  renderPeople();
  const idx = CHAR_INDEX.findIndex(p=>p.name===targetName);
  if(idx>-1){
    openCharacterModal(idx);
    document.getElementById('peopleGrid').scrollIntoView({behavior:'smooth', block:'start'});
  }
})();
</script>
